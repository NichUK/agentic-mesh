  020-architecture/enterprise/090-architecture-requirements.md:
    <<: *enterprise_architecture_document
    required_sections:
      - requirements
      - sources
      - traceability
      - status
      - review_log
    contributing_roles:
      - business-analyst
      - product-manager
      - solution-architect
      - security-architect
      - platform-engineer
      - qa-engineer
  020-architecture/enterprise/100-standards-and-reference-architectures.md:
    <<: *enterprise_architecture_document
    required_sections:
