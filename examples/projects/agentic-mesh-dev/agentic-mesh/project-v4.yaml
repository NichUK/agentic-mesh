project_id: agentic-mesh-dev
agent_network_id: agentic-mesh-dev
shared_fleet:
  enabled: false
  fleet_id: agentic-mesh
  project_assignments: []
name: Agentic Mesh Development V4
goal:
  description: Prove the V4 Codex remote-control agent runtime with one Codex app-server container per role, Postgres message queues, Teams routing, external role configuration, DB-backed memory, and safe-output tools for durable workflow effects.
worker_defaults:
  model: gpt-5.6-sol
  reasoning_effort: medium
  plan_mode_reasoning_effort: medium
  show_raw_agent_reasoning: false
document_library:
  adapter: onedrive
  drive_id: ${AGENTIC_MESH_ONEDRIVE_DRIVE_ID}
  root_path: /documents
  structure_policy: togaf-sdlc-v1
flow:
  template: sdlc
document_accountabilities:
  000-index/sdlc-flow.mmd:
    owner_role: project-manager
    accountability: accountable_owner
    can_edit_contributions: true
    review_on_contribution: true
    required_sections: []
    contributing_roles:
      - delivery-manager
      - enterprise-architect
  020-architecture/enterprise/000-index.md: &enterprise_architecture_document
    owner_role: enterprise-architect
    accountability: accountable_owner
    can_edit_contributions: true
    review_on_contribution: true
    required_sections:
      - purpose
      - ownership
      - portfolio_map
      - review_cadence
    contributing_roles:
      - technical-writer
  020-architecture/enterprise/010-architecture-principles.md:
    <<: *enterprise_architecture_document
    required_sections:
      - principles
      - rationale
      - implications
      - exceptions
      - review_log
    contributing_roles:
      - project-manager
      - product-manager
      - solution-architect
      - security-architect
      - platform-engineer
  020-architecture/enterprise/020-architecture-vision.md:
    <<: *enterprise_architecture_document
    required_sections:
      - drivers
      - stakeholders
      - scope
      - baseline_summary
      - target_summary
      - outcomes
      - review_log
    contributing_roles:
      - business-analyst
      - product-manager
      - project-manager
  020-architecture/enterprise/030-business-capability-map.md:
    <<: *enterprise_architecture_document
    required_sections:
      - baseline_capabilities
      - target_capabilities
      - capability_gaps
      - dependencies
      - review_log
    contributing_roles:
      - business-analyst
      - product-manager
      - research-analyst
  020-architecture/enterprise/040-target-operating-model.md:
    <<: *enterprise_architecture_document
    required_sections:
      - scope
      - baseline_operating_model
      - target_operating_model
      - people
      - process
      - governance
      - technology_enablement
      - transition
      - review_log
    contributing_roles:
      - business-analyst
      - product-manager
      - ux-designer
      - project-manager
      - delivery-manager
      - platform-engineer
      - release-manager
  020-architecture/enterprise/050-business-architecture.md:
    <<: *enterprise_architecture_document
    required_sections: &domain_architecture_sections
      - baseline
      - target
      - gaps
      - decisions
      - dependencies
      - review_log
    contributing_roles:
      - business-analyst
      - product-manager
      - ux-designer
  020-architecture/enterprise/060-data-architecture.md:
