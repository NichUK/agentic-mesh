project_id: agentic-mesh-dev
name: Agentic Mesh Development
goal:
  description: Build Agentic Mesh into an open-core, enterprise-ready, role-based agent mesh runtime that can coordinate complex project and business workflows through pluggable connectors for messaging, work intake, data sources, repositories, and delivery systems such as Microsoft Teams, Slack, GitHub Issues, Azure DevOps, email, documents, and future enterprise tools.
  success_measures:
  - Outcome is achieved with only necessary human intervention to set direction and priorities.
  - Agents ask the necessary clarifying questions before acting on ambiguous instructions.
  - Agents work together through configured flows, reviews, handoffs, and blocker escalation to keep work moving towards the goal.
  - Work is routed to the smallest appropriate set of roles.
  - Agents acknowledge, plan, execute, and report blockers visibly.
  - Useful artifacts are produced only when they advance the work.
  - Status, blockers, and errors are reported in channels, not hidden in documents.
  - Changes are made through Git-backed project work rather than ad hoc runtime edits.
  constraints:
  - Keep work aligned to the configured lifecycle unless a sponsor explicitly asks for direct work.
  - Direct work should coordinate or clarify; implementation work should become a tracked slice when it needs multiple roles.
  - Do not create documents just to record failure or status.
  - Preserve specialist decision ownership; delivery coordination keeps work on track but does not make specialist decisions.
  - Keep messaging, intake, repository, document, and delivery systems behind connector boundaries rather than hard-wiring Teams, Slack, GitHub, Azure DevOps, or any one vendor into product semantics.
  guidance:
  - Every action should advance the project goal, reduce a meaningful risk to it, or clearly explain why progress is blocked.
  - Prefer small scoped slices with visible acceptance criteria, review points, and test evidence.
  - Keep sponsor-facing outputs concise, useful, and tied to work item IDs.
  - Clarify ambiguity by asking questions or proposing assumptions, not by making decisions or inventing details.
flow:
  template: sdlc
workspace:
  root: examples/projects/agentic-mesh-dev
  default_repository: agentic-mesh
  repositories:
    agentic-mesh:
      type: git
      path: ../../..
      default_branch: develop
document_library:
  backend: git
  root: ../../..
  structure_policy: togaf-sdlc-v1
  index_path: docs/00-index/document-library-manifest.json
  review_log_standard: same-document-review-log-v1
  versioning: backend
role_memory:
  enabled: true
  backend: filesystem
  root: agentic-mesh/roles
  config_root: agentic-mesh/roles
  memory_filename: MEMORY.md
  provenance_required: true
  refresh_from_document_library: true
  team_overlay_root: agentic-mesh/team-overlays
container_lifecycle:
  adapter: docker-compose
  compose_files:
  - ../deploy/compose/docker-compose.yml
  - ../deploy/compose/docker-compose.linuxch.yml
  service_name_template: "{project_id}-{role_id}-{index}"
  working_directory: ../deploy/compose
release_deployment_targets:
  dogfood_compose:
    type: command
    description: Build and activate the linuxch dogfood Docker Compose runtime from the checked-out project repository.
    command:
    - sh
    - scripts/release-linuxch-compose.sh
    working_directory: /mesh/workspaces/agentic-mesh
    timeout_seconds: 900
    impact_categories:
    - runtime_code
    - container_image
    - service_restart_or_recreate
    activation_paths:
    - rebuild_image
    - recreate_container
    smoke:
      route_label: /status
      url: http://control-plane:8080/status
      expected_status_code: 200
      content_expectation: Agentic Mesh Status
    rollback_summary: Rebuild and activate the previous reviewed image or revert the scoped commit and rerun the dogfood Compose activation target.
meshes:
  governance:
    name: Governance Mesh
    flow: governance
    roles:
    - enterprise-architect
    - delivery-manager
    - release-manager
    purpose: Track cross-team outcomes without taking specialist decision ownership.
  sdlc:
    name: SDLC Mesh
    flow: sdlc
    parent_mesh: governance
    roles:
    - business-analyst
    - product-manager
    - prompt-engineer
    - ux-designer
    - enterprise-architect
    - solution-architect
    - security-architect
    - platform-engineer
    - engineering
    - qa-engineer
    - technical-writer
    - delivery-manager
    - release-manager
    purpose: Deliver software slices, features, spikes, and sub-slices through the project SDLC.
