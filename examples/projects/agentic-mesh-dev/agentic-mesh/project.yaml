capability_defaults:
  schema_version: role-capability-profile-v0
  capabilities:
  - capability_id: worker.codex
    category: worker_capability
    requirement: required
    display_name: Codex worker adapter
    description: Role can invoke the configured worker adapter through deployment-bound auth.
    validation:
      kind: worker_auth
      freshness_seconds: 86400
    affects:
      lifecycle_states:
      - business_analysis
      - product_definition
      - implementation
      - quality_review
    impact: Role startup and status publication depend on worker auth binding.
    next_action: Repair the role worker auth binding or credential mount reference.
    action_owner: platform-engineer
  - capability_id: document-library.read
    category: document_library
    requirement: required
    display_name: Document library read
    description: Role can inspect canonical project documents through the configured document library.
    validation:
      kind: document_library
      freshness_seconds: 86400
    impact: Lifecycle work depends on source-linked project memory and artifacts.
    next_action: Repair the document library configuration or workspace mount.
    action_owner: platform-engineer
  - capability_id: git.read
    category: logical_tool
    requirement: required
    display_name: Git read
    description: Role can inspect repository history and worktree status.
    validation:
      kind: command
      command:
      - git
      - --version
      freshness_seconds: 86400
      timeout_seconds: 5
    impact: Git-backed configuration, documentation, and evidence require repository inspection.
    next_action: Ensure git is present in the role image or deployment profile.
    action_owner: platform-engineer
  - capability_id: python.runtime
    category: runtime_package
    requirement: required
    display_name: Python runtime packages
    description: Role runtime can import required Python configuration dependencies.
    validation:
      kind: python_import
      target: yaml
      freshness_seconds: 86400
    impact: Config loading and local validation depend on runtime Python packages.
    next_action: Ensure required Python packages are installed in the shared runtime image.
    action_owner: platform-engineer
  - capability_id: teams.notify
    category: external_connector
    requirement: optional
    display_name: Teams connector notification
    description: Role can use the connector-neutral Teams route when configured.
    validation:
      kind: connector_config
      target: teams
      freshness_seconds: 86400
    impact: Missing Teams notification support reduces visibility but does not block local CLI status.
    fallback:
      owner: delivery-manager
      policy_summary: Use CLI/status dashboard and work-item artifacts when Teams delivery is unavailable.
      residual_impact: Sponsor-facing notifications may need manual relay.
      review_point: Before release review.
    next_action: Repair connector configuration or use dashboard-only status.
    action_owner: platform-engineer
