roles:
  business-analyst:
    template: business-analyst
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Frame Agentic Mesh work in terms of enterprise users, operating constraints,
      and measurable outcomes.
    - Produce business context before Product defines implementation slices.
    write_paths:
    - docs/business/**
    - docs/implementation-slices/**
    - documents/analysis/**
    channels:
      primary: business-analysis
      handoff_inbox: business-analysis
  product-manager:
    template: product-manager
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Define product intent, slice boundaries, and acceptance criteria before downstream
      work.
    - Treat slices, features, and spikes as separate work items that can progress
      independently.
    write_paths:
    - docs/product/**
    - docs/implementation-slices/**
    - documents/analysis/**
    channels:
      primary: product
      handoff_inbox: product
  ux-designer:
    template: ux-designer
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Define UX implications for control-plane, Teams, and local developer workflows
      when a slice affects human interaction.
    - Keep UX artifacts lightweight until a UI surface is actually in scope.
    write_paths:
    - docs/ux/**
    - docs/implementation-slices/**
    - documents/analysis/**
    channels:
      primary: ux
      handoff_inbox: ux
  enterprise-architect:
    template: enterprise-architect
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Review system/project repository boundaries, governance, integration, and enterprise
      operating model concerns.
    - Keep architecture recommendations compatible with open-core and adapter-boundary
      decisions.
    write_paths:
    - docs/architecture/**
    - docs/implementation-slices/**
    - documents/analysis/**
    channels:
      primary: enterprise-architecture
      handoff_inbox: enterprise-architecture
  solution-architect:
    template: solution-architect
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Keep architecture guidance grounded in Agentic Mesh runtime boundaries.
    - Prefer local-first interfaces before cloud-specific backends.
    write_paths:
    - docs/architecture/**
    - docs/implementation-slices/**
    - documents/analysis/**
    channels:
      primary: solution-architecture
      handoff_inbox: solution-architecture
  security-architect:
    template: security-architect
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Review credential handling, connector permissions, container identity, and secret-reference
      design.
    - Require explicit evidence that no credentials are committed to example or project
      config.
    write_paths:
    - docs/security/**
    - docs/architecture/**
    - documents/analysis/**
    channels:
      primary: security
      handoff_inbox: security
  platform-engineer:
    template: platform-engineer
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Keep Docker Compose, state paths, telemetry, and local runtime automation aligned
      with the architecture docs.
    - Preserve cloud deployment options behind adapters.
    write_paths:
    - docs/platform/**
    - docs/operations/**
    - examples/projects/agentic-mesh-dev/**
    - Dockerfile
    - config/otel/**
    - documents/analysis/**
    channels:
      primary: platform
      handoff_inbox: platform
  engineering:
    template: engineering
    instances: 2
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Treat this as a multi-instance role; claim work atomically and avoid duplicate
      implementation.
    - Preserve work_item_id and lifecycle_state in all handoffs and evidence.
    write_paths:
    - src/**
    - tests/**
    - docs/engineering/**
    - documents/analysis/**
    channels:
      primary: engineering
      handoff_inbox: engineering
  qa-engineer:
    template: qa-engineer
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Validate each slice independently so parallel work streams remain inspectable.
    - Record evidence against the originating work_item_id.
    write_paths:
    - docs/qa/**
    - tests/**
    - documents/analysis/**
    channels:
      primary: qa
      handoff_inbox: qa
  technical-writer:
    template: technical-writer
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Validate documentation clarity before release review.
    - Keep README, architecture, operation, and memory docs aligned.
    write_paths:
    - README.md
    - MEMORY.md
    - docs/**
    - documents/analysis/**
    channels:
      primary: technical-writing
      handoff_inbox: technical-writing
  delivery-manager:
    template: delivery-manager
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Track blockers and handoff aging without taking decision ownership from specialist
      roles.
    - Keep delivery status tied to work_item_id.
    write_paths:
    - docs/delivery/**
    - documents/analysis/**
    channels:
      primary: delivery
      handoff_inbox: delivery
  research-analyst:
    template: research-analyst
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Research future stock enterprise flow catalogs and cite sources.
    - Hand synthesized findings to Business Analysis, Product, or Enterprise Architecture.
    write_paths:
    - docs/research/**
    - docs/architecture/**
    - documents/analysis/**
    channels:
      primary: research
      handoff_inbox: research
  release-manager:
    template: release-manager
    instances: 1
    worker:
      adapter: codex-cli
      model: codex
      reasoning_effort: high
      sandbox_mode: danger-full-access
      auth:
        credential: codex-agentic-mesh-dev-team
    instructions:
    - Close only work items with product, architecture, implementation, and QA evidence.
    - Keep release records linked to work_item_id.
    write_paths:
    - docs/releases/**
    - documents/analysis/**
    channels:
      primary: release
      handoff_inbox: release
