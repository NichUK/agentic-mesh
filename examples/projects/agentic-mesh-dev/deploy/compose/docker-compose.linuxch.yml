services:
  v3-nats:
    restart: unless-stopped

  v3-runtime:
    restart: unless-stopped
    volumes:
      - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
      - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
      - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh
      - ${AGENTIC_MESH_CODEX_HOME_HOST_PATH:-../../state/worker_mounts/codex-agentic-mesh-dev-team-home-q}:/mesh/worker-auth/codex
      - /var/run/docker.sock:/var/run/docker.sock

  v3-supervisor:
    restart: unless-stopped
    volumes:
      - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
      - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
      - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh
      - ${AGENTIC_MESH_CODEX_HOME_HOST_PATH:-../../state/worker_mounts/codex-agentic-mesh-dev-team-home-q}:/mesh/worker-auth/codex
      - /var/run/docker.sock:/var/run/docker.sock

  v3-dogfood-proof:
    volumes:
      - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
      - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
      - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh
      - ${AGENTIC_MESH_CODEX_HOME_HOST_PATH:-../../state/worker_mounts/codex-agentic-mesh-dev-team-home-q}:/mesh/worker-auth/codex
      - /var/run/docker.sock:/var/run/docker.sock

  agentic-mesh-dev-product-manager-1:
    restart: "no"

  agentic-mesh-dev-business-analyst-1:
    restart: "no"

  agentic-mesh-dev-delivery-manager-1:
    restart: "no"

  agentic-mesh-dev-enterprise-architect-1:
    restart: "no"

  agentic-mesh-dev-platform-engineer-1:
    restart: "no"

  agentic-mesh-dev-prompt-engineer-1:
    restart: "no"

  agentic-mesh-dev-project-manager-1:
    restart: "no"
    volumes:
      - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
      - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
      - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh
      - ${AGENTIC_MESH_CODEX_HOME_HOST_PATH:-../../state/worker_mounts/codex-agentic-mesh-dev-team-home-q}:/mesh/worker-auth/codex
      - /var/run/docker.sock:/var/run/docker.sock

  agentic-mesh-dev-research-analyst-1:
    restart: "no"

  agentic-mesh-dev-security-architect-1:
    restart: "no"

  agentic-mesh-dev-solution-architect-1:
    restart: "no"

  agentic-mesh-dev-engineering-1:
    restart: "no"

  agentic-mesh-dev-qa-engineer-1:
    restart: "no"

  agentic-mesh-dev-release-manager-1:
    restart: "no"
    volumes:
      - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
      - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
      - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh
      - ${AGENTIC_MESH_CODEX_HOME_HOST_PATH:-../../state/worker_mounts/codex-agentic-mesh-dev-team-home-q}:/mesh/worker-auth/codex
      - /var/run/docker.sock:/var/run/docker.sock

  agentic-mesh-dev-technical-writer-1:
    restart: "no"

  agentic-mesh-dev-ux-designer-1:
    restart: "no"

  otel-collector:
    ports: !reset []
    networks:
      - default
      - observability
    restart: unless-stopped

networks:
  observability:
    external: true
