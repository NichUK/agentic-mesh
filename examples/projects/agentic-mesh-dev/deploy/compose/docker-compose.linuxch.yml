x-restricted-safe-output-config: &restricted-safe-output-config
  type: bind
  source: ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}/deploy/codex/restricted-safe-output-config.toml
  target: /etc/codex/config.toml
  read_only: true
  bind:
    create_host_path: false

services:
  runtime:
    restart: unless-stopped
    environment:
      PYTHONPATH: /mesh/system/src
    volumes:
      - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
      - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
      - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh
      - /var/run/docker.sock:/var/run/docker.sock

  dispatcher:
    restart: unless-stopped
    environment:
      PYTHONPATH: /mesh/system/src
    volumes:
      - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
      - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
      - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh
      - /var/run/docker.sock:/var/run/docker.sock

  watchdog:
    restart: unless-stopped
    environment:
      PYTHONPATH: /mesh/system/src
    volumes:
      - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
      - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
      - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh
      - /var/run/docker.sock:/var/run/docker.sock

  otel-collector:
    ports: !reset []
    networks:
      - default
      - observability
    restart: unless-stopped

  agentic-mesh-dev-project-manager-1:
    environment:
      PYTHONPATH: /mesh/system/src

  agentic-mesh-dev-delivery-manager-1:
    environment:
      PYTHONPATH: /mesh/system/src

  agentic-mesh-dev-product-manager-1:
    environment:
      PYTHONPATH: /mesh/system/src
    volumes:
      - *restricted-safe-output-config

  agentic-mesh-dev-business-analyst-1:
    environment:
      PYTHONPATH: /mesh/system/src
    volumes:
      - *restricted-safe-output-config

  agentic-mesh-dev-research-analyst-1:
    environment:
      PYTHONPATH: /mesh/system/src
    volumes:
      - *restricted-safe-output-config

  agentic-mesh-dev-enterprise-architect-1:
    environment:
      PYTHONPATH: /mesh/system/src

  agentic-mesh-dev-solution-architect-1:
    environment:
      PYTHONPATH: /mesh/system/src

  agentic-mesh-dev-security-architect-1:
    environment:
      PYTHONPATH: /mesh/system/src
    volumes:
      - *restricted-safe-output-config

  agentic-mesh-dev-ux-designer-1:
    environment:
      PYTHONPATH: /mesh/system/src
    volumes:
      - *restricted-safe-output-config

  agentic-mesh-dev-engineering-1:
    environment:
      PYTHONPATH: /mesh/system/src

  agentic-mesh-dev-qa-engineer-1:
    environment:
      PYTHONPATH: /mesh/system/src
    volumes:
      - *restricted-safe-output-config

  agentic-mesh-dev-platform-engineer-1:
    environment:
      PYTHONPATH: /mesh/system/src

  agentic-mesh-dev-release-manager-1:
    environment:
      PYTHONPATH: /mesh/system/src

  agentic-mesh-dev-technical-writer-1:
    environment:
      PYTHONPATH: /mesh/system/src

  agentic-mesh-dev-prompt-engineer-1:
    environment:
      PYTHONPATH: /mesh/system/src

networks:
  observability:
    external: true
