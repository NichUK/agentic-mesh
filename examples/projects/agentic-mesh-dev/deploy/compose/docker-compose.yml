x-agentic-mesh-env: &agentic-mesh-env
  AGENTIC_MESH_CONFIG_ROOT: /mesh/system
  AGENTIC_MESH_PROMPT_CONFIG_ROOT: /mesh/system/config/prompts
  AGENTIC_MESH_PROJECT_FILE: /mesh/project/agentic-mesh/project.yaml
  AGENTIC_MESH_STATE_ROOT: /mesh/project/state/v2
  AGENTIC_MESH_WORKSPACE_ROOT: /mesh/workspaces/agentic-mesh
  AGENTIC_MESH_URL_ROOT: ${AGENTIC_MESH_URL_ROOT:-http://linuxch:8100}
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dogfood

x-agentic-mesh-volumes: &agentic-mesh-volumes
  - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
  - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
  - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh

x-agentic-mesh-service: &agentic-mesh-service
  image: agentic-mesh:local
  environment: *agentic-mesh-env
  volumes: *agentic-mesh-volumes
  working_dir: /mesh/workspaces/agentic-mesh

services:
  runtime-image:
    image: agentic-mesh:local
    build: ${AGENTIC_MESH_RUNTIME_BUILD_CONTEXT:-../../../../..}
    command: python -m agentic_mesh_v2.cli init-db
    profiles:
      - build-image

  v2-runtime:
    <<: *agentic-mesh-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 serve --host 0.0.0.0 --port 8080 --project-file /mesh/project/agentic-mesh/project.yaml
    ports:
      - "8100:8080"

  v2-supervisor:
    <<: *agentic-mesh-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-project-supervisor-service --project-file /mesh/project/agentic-mesh/project.yaml --continuous --poll-seconds ${AGENTIC_MESH_SUPERVISOR_POLL_SECONDS:-5} --execute
    depends_on:
      - v2-runtime

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ${AGENTIC_MESH_OTEL_COLLECTOR_CONFIG_HOST_PATH:-../../../../../config/otel/collector.yaml}:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
