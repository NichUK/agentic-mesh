x-agentic-mesh-v3-service: &agentic-mesh-v3-service
  <<: *agentic-mesh-service
  environment: *agentic-mesh-v3-env

x-agentic-mesh-v3-role-service: &agentic-mesh-v3-role-service
  <<: *agentic-mesh-v3-service
  depends_on:
    - v3-nats
  volumes: *agentic-mesh-role-volumes
  restart: "no"
  profiles:
    - v3

services:
  runtime-image:
    <<: *agentic-mesh-service
    command: python -m agentic_mesh_v3.cli init-db
    profiles:
      - build-image

  v3-nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - ${AGENTIC_MESH_NATS_STATE_HOST_PATH:-../../state/v3/nats}:/data
    profiles:
      - v3
      - v3-proof

  v3-runtime:
    <<: *agentic-mesh-v3-service
    command: sh -c "python -m agentic_mesh_v3.cli --project-config /mesh/project/agentic-mesh/project-v3.yaml preflight-live --check-broker && exec python -m agentic_mesh_v3.cli --db /mesh/project/state/v3/agentic-mesh-v3.sqlite3 --project-id agentic-mesh-dev --project-config /mesh/project/agentic-mesh/project-v3.yaml serve --host 0.0.0.0 --port 8080"
    ports:
      - "${AGENTIC_MESH_V3_STATUS_PORT:-8100}:8080"
    depends_on:
      - v3-nats
    profiles:
      - v3

  v3-supervisor:
    <<: *agentic-mesh-v3-service
    command: python -m agentic_mesh_v3.cli --db /mesh/project/state/v3/agentic-mesh-v3.sqlite3 --project-id agentic-mesh-dev --project-config /mesh/project/agentic-mesh/project-v3.yaml run-project-supervisor-service --continuous --poll-seconds ${AGENTIC_MESH_SUPERVISOR_POLL_SECONDS:-5} --idle-after-seconds ${AGENTIC_MESH_AGENT_IDLE_SECONDS:-1800} --min-warm-instances-per-role ${AGENTIC_MESH_MIN_WARM_ROLE_INSTANCES:-0} --refresh-inbox-from-broker --compose-file /mesh/project/deploy/compose/docker-compose.yml --compose-file /mesh/project/deploy/compose/docker-compose.linuxch.yml --compose-profile v3 --compose-project-name ${COMPOSE_PROJECT_NAME:-agentic-mesh} --lifecycle-lock-path ${AGENTIC_MESH_LIFECYCLE_LOCK_PATH:-/mesh/project/state/v3/compose-lifecycle.lock} --working-directory /mesh/project/deploy/compose --execute
    depends_on:
      - v3-nats
      - v3-runtime
    profiles:
      - v3

  v3-dogfood-proof:
    <<: *agentic-mesh-v3-service
    command: python -m agentic_mesh_v3.cli --db /mesh/project/state/v3/agentic-mesh-v3.sqlite3 --project-id agentic-mesh-dev --project-config /mesh/project/agentic-mesh/project-v3.yaml agent-e2e-dogfood --runtime-state-dir /mesh/project/state/v3/agent-service-dogfood --deployment-target-id dogfood-compose --broker-stream agent-inbox-proof
    depends_on:
      - v3-nats
    profiles:
      - v3-proof

  agentic-mesh-dev-product-manager-1:
    <<: *agentic-mesh-v3-role-service
    command: python -m agentic_mesh_v3.cli --db /mesh/project/state/v3/agentic-mesh-v3.sqlite3 --project-id agentic-mesh-dev --project-config /mesh/project/agentic-mesh/project-v3.yaml run-agent-service --role-id product-manager --instance-id 1 --agent-config-dir /mesh/project/state/v3/agent-configs/product-manager/1 --runtime-state-dir /mesh/project/state/v3 --max-messages 1 --poll-interval-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-business-analyst-1:
    <<: *agentic-mesh-v3-role-service
    command: python -m agentic_mesh_v3.cli --db /mesh/project/state/v3/agentic-mesh-v3.sqlite3 --project-id agentic-mesh-dev --project-config /mesh/project/agentic-mesh/project-v3.yaml run-agent-service --role-id business-analyst --instance-id 1 --agent-config-dir /mesh/project/state/v3/agent-configs/business-analyst/1 --runtime-state-dir /mesh/project/state/v3 --max-messages 1 --poll-interval-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

