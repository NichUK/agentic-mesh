x-agentic-mesh-env: &agentic-mesh-env
  AGENTIC_MESH_CONFIG_ROOT: /mesh/system
  AGENTIC_MESH_PROMPT_CONFIG_ROOT: /mesh/system/config/prompts
  AGENTIC_MESH_PROJECT_FILE: /mesh/project/agentic-mesh/project.yaml
  AGENTIC_MESH_STATE_ROOT: /mesh/project/state/v2
  AGENTIC_MESH_WORKSPACE_ROOT: /mesh/workspaces/agentic-mesh
  AGENTIC_MESH_URL_ROOT: ${AGENTIC_MESH_URL_ROOT:-http://linuxch:8100}
  AGENTIC_MESH_IMAGE_TAG: ${AGENTIC_MESH_IMAGE_TAG:-agentic-mesh:local}
  AGENTIC_MESH_SOURCE_COMMIT: ${AGENTIC_MESH_SOURCE_COMMIT:-}
  AGENTIC_MESH_SOURCE_BRANCH: ${AGENTIC_MESH_SOURCE_BRANCH:-}
  AGENTIC_MESH_BUILD_REF: ${AGENTIC_MESH_BUILD_REF:-}
  AGENTIC_MESH_BUILD_TIME: ${AGENTIC_MESH_BUILD_TIME:-}
  AGENTIC_MESH_ENVIRONMENT: ${AGENTIC_MESH_ENVIRONMENT:-dogfood}
  CODEX_HOME: /mesh/worker-auth/codex
  OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dogfood

x-agentic-mesh-volumes: &agentic-mesh-volumes
  - ${AGENTIC_MESH_SYSTEM_HOST_PATH:-../../../../..}:/mesh/system:ro
  - ${AGENTIC_MESH_PROJECT_HOST_PATH:-../..}:/mesh/project
  - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:-../../../../..}:/mesh/workspaces/agentic-mesh
  - ${AGENTIC_MESH_CODEX_HOME_HOST_PATH:-../../state/worker_mounts/codex-agentic-mesh-dev-team-home-q}:/mesh/worker-auth/codex

x-agentic-mesh-service: &agentic-mesh-service
  image: agentic-mesh:local
  build: ${AGENTIC_MESH_RUNTIME_BUILD_CONTEXT:-../../../../..}
  environment: *agentic-mesh-env
  volumes: *agentic-mesh-volumes
  working_dir: /mesh/workspaces/agentic-mesh

x-agentic-mesh-role-service: &agentic-mesh-role-service
  <<: *agentic-mesh-service
  depends_on:
    - v2-runtime

x-agentic-mesh-v3-env: &agentic-mesh-v3-env
  <<: *agentic-mesh-env
  AGENTIC_MESH_PROJECT_FILE: /mesh/project/agentic-mesh/project-v3.yaml
  AGENTIC_MESH_STATE_ROOT: /mesh/project/state/v3
  AGENTIC_MESH_ONEDRIVE_TOKEN: ${AGENTIC_MESH_ONEDRIVE_TOKEN:-}
  AGENTIC_MESH_ONEDRIVE_DRIVE_ID: ${AGENTIC_MESH_ONEDRIVE_DRIVE_ID:-}
  AGENTIC_MESH_SPONSOR_TEAMS_USER_ID: ${AGENTIC_MESH_SPONSOR_TEAMS_USER_ID:-}
  AGENTIC_MESH_TEAMS_TOKEN: ${AGENTIC_MESH_TEAMS_TOKEN:-}
  AGENTIC_MESH_TEAMS_SENDER_USER_ID: ${AGENTIC_MESH_TEAMS_SENDER_USER_ID:-}

x-agentic-mesh-v3-service: &agentic-mesh-v3-service
  <<: *agentic-mesh-service
  environment: *agentic-mesh-v3-env

services:
  runtime-image:
    <<: *agentic-mesh-service
    command: python -m agentic_mesh_v2.cli init-db
    profiles:
      - build-image

  v3-nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    volumes:
      - ${AGENTIC_MESH_NATS_STATE_HOST_PATH:-../../state/v3/nats}:/data
    profiles:
      - v3
      - v3-proof

  v3-runtime:
    <<: *agentic-mesh-v3-service
    command: python -m agentic_mesh_v3.cli --db /mesh/project/state/v3/agentic-mesh-v3.sqlite3 --project-id agentic-mesh-dev --project-config /mesh/project/agentic-mesh/project-v3.yaml serve --host 0.0.0.0 --port 8080
    ports:
      - "${AGENTIC_MESH_V3_STATUS_PORT:-8101}:8080"
    depends_on:
      - v3-nats
    profiles:
      - v3

  v3-dogfood-proof:
    <<: *agentic-mesh-v3-service
    command: python -m agentic_mesh_v3.cli --db /mesh/project/state/v3/agentic-mesh-v3.sqlite3 --project-id agentic-mesh-dev --project-config /mesh/project/agentic-mesh/project-v3.yaml local-e2e-dogfood --deployment-target-id dogfood-compose
    depends_on:
      - v3-nats
    profiles:
      - v3-proof

  v2-runtime:
    <<: *agentic-mesh-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 serve --host 0.0.0.0 --port 8080 --project-file /mesh/project/agentic-mesh/project.yaml
    ports:
      - "8100:8080"

  v2-teams-ingress:
    <<: *agentic-mesh-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 serve-teams-ingress --host 0.0.0.0 --port 3978 --project-file /mesh/project/agentic-mesh/project.yaml --path /api/messages --external-base-url ${AGENTIC_MESH_URL_ROOT:-http://linuxch:8100}
    ports:
      - "3978:3978"
    depends_on:
      - v2-runtime

  v2-supervisor:
    <<: *agentic-mesh-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-project-supervisor-service --project-file /mesh/project/agentic-mesh/project.yaml --continuous --poll-seconds ${AGENTIC_MESH_SUPERVISOR_POLL_SECONDS:-5} --execute
    depends_on:
      - v2-runtime

  agentic-mesh-dev-business-analyst-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id business-analyst --role-instance-id agentic-mesh-dev.business-analyst.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-product-manager-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id product-manager --role-instance-id agentic-mesh-dev.product-manager.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-prompt-engineer-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id prompt-engineer --role-instance-id agentic-mesh-dev.prompt-engineer.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-ux-designer-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id ux-designer --role-instance-id agentic-mesh-dev.ux-designer.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-enterprise-architect-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id enterprise-architect --role-instance-id agentic-mesh-dev.enterprise-architect.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-solution-architect-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id solution-architect --role-instance-id agentic-mesh-dev.solution-architect.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-security-architect-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id security-architect --role-instance-id agentic-mesh-dev.security-architect.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-platform-engineer-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id platform-engineer --role-instance-id agentic-mesh-dev.platform-engineer.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-engineering-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id engineering --role-instance-id agentic-mesh-dev.engineering.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-engineering-2:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id engineering --role-instance-id agentic-mesh-dev.engineering.2 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-qa-engineer-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id qa-engineer --role-instance-id agentic-mesh-dev.qa-engineer.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-technical-writer-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id technical-writer --role-instance-id agentic-mesh-dev.technical-writer.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-delivery-manager-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id delivery-manager --role-instance-id agentic-mesh-dev.delivery-manager.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-research-analyst-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id research-analyst --role-instance-id agentic-mesh-dev.research-analyst.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  agentic-mesh-dev-release-manager-1:
    <<: *agentic-mesh-role-service
    command: python -m agentic_mesh_v2.cli --db /mesh/project/state/v2/agentic-mesh-v2.sqlite3 run-role-service-loop --project-file /mesh/project/agentic-mesh/project.yaml --role-id release-manager --role-instance-id agentic-mesh-dev.release-manager.1 --continuous --poll-seconds ${AGENTIC_MESH_ROLE_POLL_SECONDS:-5}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.101.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ${AGENTIC_MESH_OTEL_COLLECTOR_CONFIG_HOST_PATH:-../../../../../config/otel/collector.yaml}:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
