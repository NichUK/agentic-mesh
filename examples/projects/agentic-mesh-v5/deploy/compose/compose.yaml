name: agentic-mesh-v5

x-worker-environment: &worker-environment
  AGENTIC_MESH_V5_API_TOKEN_FILE: /run/secrets/api_token
  AGENTIC_MESH_V5_API_URL: http://control:8080
  AGENTIC_MESH_V5_CONFIG_ROOT: /mesh/config
  CODEX_HOME: /codex-home
  PYTHONUNBUFFERED: "1"

x-worker: &worker
  restart: unless-stopped
  env_file:
    - ${AGENTIC_MESH_V5_RUNTIME_ENV:?set the external runtime environment file}
  environment: *worker-environment
  depends_on:
    control:
      condition: service_healthy
  networks: [core]
  stop_grace_period: 45s

services:
  database:
    image: ${AGENTIC_MESH_POSTGRES_IMAGE:?set a digest-pinned Postgres image}
    container_name: amv5-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENTIC_MESH_POSTGRES_DB:-agentic_mesh_v5}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: ${AGENTIC_MESH_POSTGRES_USER:-agentic_mesh}
    secrets: [postgres_password]
    volumes:
      - type: bind
        source: ${AGENTIC_MESH_POSTGRES_DATA_PATH:?set the external Postgres data path}
        target: /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [core]

  migrate:
    image: ${AGENTIC_MESH_V5_RUNTIME_IMAGE:?set a digest-pinned V5 runtime image}
    restart: "no"
    env_file:
      - ${AGENTIC_MESH_V5_RUNTIME_ENV:?set the external runtime environment file}
    command: [database-migrate]
    depends_on:
      database:
        condition: service_healthy
    networks: [core]

  telemetry:
    image: ${AGENTIC_MESH_OTEL_IMAGE:?set a digest-pinned OpenTelemetry Collector image}
    container_name: amv5-telemetry
    restart: unless-stopped
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - type: bind
        source: ../otel/collector.yaml
        target: /etc/otelcol/config.yaml
        read_only: true
    networks: [core]

  control:
    image: ${AGENTIC_MESH_V5_RUNTIME_IMAGE:?set a digest-pinned V5 runtime image}
    container_name: amv5-control
    restart: unless-stopped
    env_file:
      - ${AGENTIC_MESH_V5_RUNTIME_ENV:?set the external runtime environment file}
    environment:
      AGENTIC_MESH_V5_API_PRINCIPALS_FILE: /run/agentic-mesh/principals.json
      AGENTIC_MESH_V5_CONFIG_ROOT: /mesh/config
      AGENTIC_MESH_V5_DOCUMENT_CREDENTIAL_ROOT: /run/agentic-mesh/document-credentials
      AGENTIC_MESH_V5_DOCUMENT_ROOT_ID: project-library
      AGENTIC_MESH_V5_FLEET_MAP: /mesh/runtime/fleet.json
      PYTHONUNBUFFERED: "1"
    command: [api-serve, --host, 0.0.0.0, --port, "8080"]
    group_add:
      - ${AGENTIC_MESH_DOCKER_GID:?set the Linux host Docker group id}
    depends_on:
      migrate:
        condition: service_completed_successfully
      telemetry:
        condition: service_started
    ports:
      - "127.0.0.1:${AGENTIC_MESH_V5_PORT:-18080}:8080"
    volumes:
      - type: bind
        source: ${AGENTIC_MESH_CONFIG_HOST_PATH:?set the external config checkout}
        target: /mesh/config
        read_only: true
      - type: bind
        source: ${AGENTIC_MESH_CONFIG_STATE_PATH:?set the external config state path}
        target: /mesh/config/state
      - type: bind
        source: ${AGENTIC_MESH_PRINCIPALS_FILE:?set the external principals file}
        target: /run/agentic-mesh/principals.json
        read_only: true
      - type: bind
        source: ${AGENTIC_MESH_DOCUMENT_CREDENTIAL_ROOT:?set the external document credential root}
        target: /run/agentic-mesh/document-credentials
        read_only: true
      - type: bind
        source: ./fleet.json
        target: /mesh/runtime/fleet.json
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    networks: [core]

  business-analyst:
    <<: *worker
    profiles: [fleet]
    image: ${AGENTIC_MESH_V5_WORKER_GENERAL_IMAGE:?set the general worker digest}
    container_name: amv5-business-analyst-1
    command: [python, -m, agentic_mesh_v5, role-service, --config-root, /mesh/config, --project, agentic-mesh-v5, --role, business-analyst, --instance, agentic-mesh-v5.business-analyst.1, --source-repositories, /mesh/runtime/sources.json]
    secrets:
      - source: business_analyst_api_token
        target: api_token
    volumes:
      - ${AGENTIC_MESH_CONFIG_HOST_PATH:?set the external config checkout}:/mesh/config:ro
      - ${AGENTIC_MESH_CONFIG_STATE_PATH:?set the external config state path}:/mesh/config/state
      - ./sources.json:/mesh/runtime/sources.json:ro
      - ./gitconfig:/etc/gitconfig:ro
      - ${AGENTIC_MESH_SOURCE_HOST_PATH:?set the project source checkout}:/mesh/sources/agentic-mesh
      - ${AGENTIC_MESH_WORKSPACE_HOST_PATH:?set the isolated worktree root}:/mesh/workspaces
      - codex-business-analyst:/codex-home
      - ${AGENTIC_MESH_CODEX_AUTH_FILE:?set the shared Codex auth file}:/codex-home/auth.json

