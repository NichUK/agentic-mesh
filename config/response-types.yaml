response_types:
  approve_not_approve:
    label: Approve or Not Approve
    description: Binary approval decision where only approval satisfies the gate by default.
    input_mode: choice
    value_type: string
    options:
      - value: approved
        label: Approve
        outcome: pass
      - value: not_approved
        label: Not Approve
        outcome: block
    validation:
      required: true
    ui_hints:
      button_style: decision
  yes_no:
    label: Yes or No
    description: Binary factual or preference response where the flow decides which values satisfy the gate.
    input_mode: choice
    value_type: boolean
    options:
      - value: true
        label: Yes
      - value: false
        label: No
    validation:
      required: true
  number:
    label: Number
    description: Numeric response for counts, scores, limits, thresholds, or estimates.
    input_mode: number
    value_type: number
    validation:
      required: true
  money:
    label: Money
    description: Monetary amount with optional currency and range validation.
    input_mode: money
    value_type: object
    validation:
      required: true
      required_fields:
        - amount
        - currency
    ui_hints:
      currency_default: GBP
  single_line_text:
    label: Single Line Text
    description: Short free-text response for names, references, summaries, or concise decisions.
    input_mode: single_line_text
    value_type: string
    validation:
      required: true
      max_length: 500
  multiline_text:
    label: Multiline Text
    description: Longer free-text response for rationale, exception notes, or decision context.
    input_mode: multiline_text
    value_type: string
    validation:
      required: true
      max_length: 5000
  document_reference:
    label: Document Reference
    description: Response that points to a document, uploaded artifact, or committed evidence path.
    input_mode: document_reference
    value_type: object
    validation:
      required: true
      allowed_fields:
        - path
        - url
        - attachment_id
  url:
    label: URL
    description: Response containing a URL to an external record, approval, document, dashboard, or evidence item.
    input_mode: url
    value_type: string
    validation:
      required: true
      format: uri
  document_or_url:
    label: Document Or URL
    description: Response that accepts either an uploaded/committed document reference or an external URL.
    input_mode: document_or_url
    value_type: object
    validation:
      required: true
      any_of_fields:
        - path
        - url
        - attachment_id
