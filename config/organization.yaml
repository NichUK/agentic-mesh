organization_id: agentic-mesh-defaults
name: Agentic Mesh Defaults
global_language: en-GB
global_locale: en-GB
naming_defaults:
  brand_prefix: AM
  service_name_template: "{brand_prefix}.{team_slug}.{role_id}.{ordinal}"
  bot_display_name_template: "{brand_prefix}-{role_display_name}"
  resource_namespace: agentic-mesh
documentation_defaults:
  voice: clear, concise, enterprise-oriented
  tense: present tense for system behaviour, past tense for completed evidence
  spelling: British English
  required_trace_fields:
    - project_id
    - work_item_id
    - work_item_type
    - lifecycle_state
    - role_id
    - role_instance_id
    - correlation_id
  decision_record_format:
    - context
    - decision
    - consequences
    - rollback
conversation_defaults:
  language: en-GB
  style: direct, collaborative, and evidence-led
  escalation_rule: Ask for clarification only when a safe assumption would change product, architecture, security, cost, or release outcome.
  human_update_rule: Keep human-facing updates short, specific, and tied to work item state.
work_intake_defaults:
  sponsor_initiated_work_rule: If a sponsor asks an agent to do work, answer a question that requires work, or investigate a material decision, the agent must capture or request a tracked work item and run it through the configured project flow.
  direct_agent_contact_rule: A sponsor may start by talking to any role-agent; the contacted agent is accountable for deciding whether the request can start in its own lifecycle state or must be routed to the project's default intake state.
  consult_route_rule: Agents may ask other roles for input only through configured consult routes or explicit project-approved exceptions; consults do not complete the current lifecycle state or replace required forward handoffs.
  work_item_identity_rule: Preserve work_item_id, work_item_type, lifecycle_state, and correlation_id across direct sponsor intake, consults, handoffs, gates, and closure unless a separate tracked work item is explicitly created.
handoff_defaults:
  required_fields:
    - work_item_id
    - work_item_type
    - source_lifecycle_state
    - target_lifecycle_state
    - summary
    - acceptance_or_exit_criteria
    - evidence_paths
    - open_questions
  parallel_work_rule: Preserve work item identity and do not merge slices, features, spikes, defects, or research tasks without an explicit project decision.
security_defaults:
  secrets_policy: Secret values must never be committed to system repos, project repos, examples, docs, journals, or generated artifacts.
  credential_reference_policy: Config may reference logical secret names or provider paths only.
  provider_neutrality_policy: Do not encode one model, cloud, repository host, or collaboration tool into product semantics.
