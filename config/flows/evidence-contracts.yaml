flow_id: agentic-mesh-sdlc-v0
flow_hash: 9015f6592b5d1a882748f5c6cdddbe603215acf34cf511d49725ed984c6e4051
evidence_contracts:
  - contract_id: product_definition.architecture_impact.v1
    work_item_types:
      - slice
      - subslice
      - feature
      - spike
    lifecycle_state: product_definition
    owner_role: product-manager
    enforcement: warn
    required:
      - predicate: safe_output_call
        tool_name: architecture.record_impact
        remediation: Record architecture impact through the safe-output tool before Product Definition completes.
      - predicate: work_item_field
        field: architecture_impact
        in:
          - none
          - material
          - uncertain
        remediation: Classify architecture impact as none, material, or uncertain with rationale and affected domains.
  - contract_id: enterprise_alignment.material_evidence.v1
    work_item_types:
      - slice
      - subslice
      - feature
      - spike
    lifecycle_state: enterprise_alignment
    owner_role: enterprise-architect
    enforcement: warn
    when:
      field: architecture_impact
      in:
        - material
        - uncertain
    required:
      - predicate: artifact_exists
        path: work-items/{work_item_id}/040-enterprise-alignment.md
        remediation: Record enterprise alignment, affected portfolio documents, requirements, and conformance obligations.
      - predicate: artifact_linked
        tool_name: document.link_artifact
        payload_match:
          work_item_id: "{work_item_id}"
          path: work-items/{work_item_id}/040-enterprise-alignment.md
        remediation: Link enterprise alignment through safe-output.
  - contract_id: solution_design.architecture_conformance.v1
    work_item_types:
      - slice
      - subslice
      - feature
      - spike
    lifecycle_state: solution_design
    owner_role: solution-architect
    enforcement: warn
    when:
      field: architecture_impact
      in:
        - material
        - uncertain
    required:
      - predicate: work_item_field
        field: architecture_conformance
        in:
          - approved
          - exception
        remediation: Obtain Enterprise Architecture conformance approval or a sponsor-approved exception before implementation planning.
  - contract_id: quality_review.qa_evidence.v1
    work_item_types:
      - slice
      - subslice
      - feature
      - spike
    lifecycle_state: quality_review
    owner_role: qa-engineer
    enforcement: warn
    required:
      - predicate: artifact_exists
        path: work-items/{work_item_id}/110-quality-evidence.md
        remediation: Create quality evidence before completing QA review.
      - predicate: artifact_linked
        tool_name: document.link_artifact
        payload_match:
          work_item_id: "{work_item_id}"
          path: work-items/{work_item_id}/110-quality-evidence.md
        remediation: Link quality evidence through safe-output.
    exception:
      enabled: false
      reason: Durable exception/blocker safe-output is unavailable in V4 P0.
  - contract_id: release_review.architecture_conformance.v1
    work_item_types:
      - slice
      - subslice
      - feature
      - spike
    lifecycle_state: release_review
    owner_role: release-manager
    enforcement: warn
    when:
      field: architecture_impact
      in:
        - material
        - uncertain
    required:
      - predicate: work_item_field
        field: architecture_conformance
        in:
          - approved
          - exception
        remediation: Release cannot proceed until architecture conformance or a sponsor-approved exception is recorded.
      - predicate: artifact_exists
        path: work-items/{work_item_id}/140-release-record.md
        remediation: Record release scope, conformance, deployment evidence, residual risk, and post-release architecture reconciliation.
